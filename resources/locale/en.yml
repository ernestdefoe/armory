  api:
    rp_not_installed: Role-Play is not installed on this forum.
    arena_not_installed: Arena is not installed on this forum.
    character_not_found: Character not found.

  admin:
    region_us: Americas (US)
    region_eu: Europe (EU)
    region_kr: Korea (KR)
    region_tw: Taiwan (TW)
    recruiting_label: Now recruiting (classes)
    recruiting_help: Tick the classes you're actively recruiting and add an optional note per class (specs, priority). Shown by the Now Recruiting widget — add it from the theme editor's Widgets tray.
    recruiting_note_placeholder: "Note — e.g. Resto or Elemental (optional)"
    client_id: Battle.net Client ID
    client_secret: Battle.net Client Secret
    client_help: "Create an API client at develop.battle.net/access/clients and set its Redirect URL to https://YOUR-FORUM/auth/battlenet/callback. Then paste the id + secret here."
    region: Default region
    guild_realm: Guild realm
    guild_name: Guild name
    guild_help: "Set your guild's realm and exact in-game name to enable the guild roster (all members, pulled from Battle.net — no sign-in required)."
    bnet_only_label: Battle.net sign-ups only
    bnet_only_help: "Hide regular registration and require new members to sign up through Battle.net. Admins can still create accounts manually; existing password accounts keep working."
    briefing_label: Weekly guild briefing
    briefing_help: "Auto-post a \"This Week\" topic on reset day: this week's Mythic+ affixes, Darkmoon Faire status, guild calendar events, last week's boss kills and the WoW Token price. Needs the scheduler cron; run `php flarum armory:briefing --force` to post one right now."
    briefing_tag_label: Briefing tag (slug)
    briefing_tag_help: "The tag new briefings are posted under, e.g. guild-news. Leave blank for no tag."
    briefing_pin_label: Pin the latest briefing (unpins the previous one)
    calendar_sync_label: Auto-populate the calendar with WoW events
    calendar_sync_help: "Adds upcoming Darkmoon Faire weeks and weekly resets to the ernestdefoe/calendar extension (needs it installed). Insert-only: edit or delete any generated event and it stays that way. Run `php flarum armory:calendar-sync` to fill it right now."
    wcl_label: Post raid recaps from Warcraft Logs
    wcl_help: "After each raid night, a recap thread is posted from the guild's latest public Warcraft Logs report: boss kills and wipes with best pulls, the night's top parses and a link to the full log. Checked hourly; run `php flarum armory:raid-recap` to post one right now."
    wcl_client_id_label: Warcraft Logs client ID
    wcl_client_id_help: "Create a free API client at warcraftlogs.com/api/clients — only the guild's public reports are read."
    wcl_client_secret_label: Warcraft Logs client secret
    recap_tag_label: Raid recap tag (slug)
    recap_tag_help: The tag recap threads are posted under. Leave blank to reuse the briefing tag.
    news_label: Post first-kill news threads
    news_help: "When a boss falls for the first time on a difficulty, a hype thread is posted from the Battle.net guild activity feed (checked hourly). Enabling seeds silently from the current feed, so old kills don't flood the forum. Run `php flarum armory:guild-news` to check right now."
    news_tag_label: Guild news tag (slug)
    news_tag_help: The tag first-kill threads are posted under. Leave blank to reuse the briefing tag.
    patchnotes_label: Post WoW hotfixes & patch notes
    patchnotes_help: "Auto-posts hotfix and patch-note articles from the Wowhead news feed (checked every six hours; general news never posts). Enabling seeds silently so old articles don't flood the forum. Run `php flarum armory:patch-notes` to check now."
    patchnotes_tag_label: Patch notes tag (slug)
    patchnotes_tag_help: Leave blank to reuse the guild news / briefing tag.
    strategy_label: Create boss strategy hubs
    strategy_help: "One scaffolded thread per boss of the guild's current raid (overview, assignments, logs sections), so strategy talk has a predictable home. Bosses come from linked characters' raid data; checked daily, at most two threads per run. Run `php flarum armory:strategy-hubs` to create them now."
    strategy_tag_label: Strategy tag (slug)
    strategy_tag_help: Leave blank to reuse the briefing tag.

  calendar:
    dmf_title: "🎪 Darkmoon Faire"
    dmf_description: "The Darkmoon Faire is open on Darkmoon Island all week — monthly profession quests, the carousel buff, pet battles and prize tickets."
    reset_title: "🔄 Weekly Reset"
    reset_description: "Weekly lockouts, vault rewards and quests reset."

  briefing:
    title: "⚔️ This Week in the Pact — {date}"
    intro: "The weekly reset has arrived. Here's everything you need to know this week."
    vault_heading: "Great Vault"
    vault_body: "The Vault is open — **collect last week's rewards** before you start this week's runs, and remember: dungeons, raids and delves all fill vault slots."
    affixes_heading: "Mythic+ Affixes"
    dmf_heading: "Darkmoon Faire"
    dmf_open: "**Open now!** The Faire runs through **{date}** — don't forget your monthly profession quests and the carousel buff."
    dmf_closed: "Closed this week. The Faire returns **{date}**."
    events_heading: "Guild events this week"
    activity_heading: "Last week in the guild"
    activity_kill: "Defeated **{boss}** ({mode}) — {date}"
    activity_achievement: "**{who}** earned **{name}** — {date}"
    token_heading: "WoW Token"
    token_price: "Currently **{gold} gold**."
    footer: "This briefing is posted automatically each reset. Data: Battle.net, Raider.IO and the guild calendar."

  news:
    kill_title: "⚔️ First Kill: {boss}!"
    kill_title_mode: "⚔️ First Kill: {boss} ({mode})!"
    kill_intro: "**{boss}** ({mode}) has fallen to **{guild}** — first recorded kill, {date}!"
    kill_body: "Massive congratulations to everyone on the roster. Drop your screenshots, clips and war stories below. 🎉"
    mode_unknown: "Raid"
    footer: "Posted automatically from the guild activity feed."

  patchnotes:
    read_more: "Read the full article →"
    footer: "Posted automatically from the Wowhead news feed."

  strategy:
    title: "🗡️ {boss} — {raid} Strategy"
    intro: "The strategy hub for **{boss}** in **{raid}**. Assignments, notes and vods live here — keep it current between pulls."
    overview_heading: "Overview"
    overview_body: "Drop the fight summary and key mechanics here. [Guides & ability details on Wowhead]({url})."
    assignments_heading: "Assignments"
    assignments_body: "Interrupt order, defensive rotations, positioning — raid leads edit this section before raid night."
    logs_heading: "Logs & vods"
    logs_body: "Link the night's Warcraft Logs report and any POV recordings below."
    footer: "Created automatically for the current raid. This thread is yours — edit away."

  recap:
    title: "📜 Raid Recap — {zone} — {date}"
    intro: "**{zone}** · {date} · {duration} in the instance. Here's how the night went."
    unknown_zone: Raid
    bosses_heading: "Bosses"
    boss_kill: "{boss} — down in {pulls, plural, one {# pull} other {# pulls}}"
    boss_wipe: "{boss} — {pulls, plural, one {# wipe} other {# wipes}}, best pull {best}%"
    parses_heading: "Top parses of the night"
    report_link: "View the full report on Warcraft Logs →"
    footer: "Posted automatically after each logged raid. Data: Warcraft Logs."
